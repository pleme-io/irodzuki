[package]
name = "irodzuki"
version = "0.1.10"
edition = "2024"
rust-version = "1.89.0"
description = "Irodzuki (色づき) — GPU-app theming system bridging Stylix and wgpu render pipelines"
homepage = "https://github.com/pleme-io/irodzuki"
repository = "https://github.com/pleme-io/irodzuki"
documentation = "https://docs.rs/irodzuki"
readme = "README.md"
license = "MIT"
categories = ["rendering", "gui"]
keywords = ["theme", "base16", "stylix", "wgpu", "colors"]

[lints.clippy]
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
# REV-PINNED to the shikumi-family pin (see mado Cargo.toml [patch.crates-io]
# family block): an unpinned egaku here floats to branch HEAD on any consumer
# `cargo update`, splitting the graph into TWO egaku revs (this crate's chain
# vs the consumer's family-pinned one) — a split-rev duplicate that broke
# every mado nix build with E0463 "can't find crate for irodzuki"
# (v0.1.49..v0.1.53, bisected 2026-07-02). Advance ONLY together with the
# family pin.
egaku = { git = "https://github.com/pleme-io/egaku", rev = "81d168190061c452d115f58f186429b84f489be8" , version = "0.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
