[package]
name = "irodzuki"
version = "0.1.11"
edition = "2024"
rust-version = "1.89.0"
description = "Irodzuki (色づき) — GPU-app theming system bridging Stylix and wgpu render pipelines"
homepage = "https://github.com/pleme-io/irodzuki"
repository = "https://github.com/pleme-io/irodzuki"
documentation = "https://docs.rs/irodzuki"
readme = "README.md"
license = "MIT"
categories = ["rendering", "gui"]
keywords = ["theme", "base16", "stylix", "wgpu", "colors"]

[lints.clippy]
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
# From the REGISTRY, which is what actually closes the split-rev class the
# old rev pin was mitigating. A git dep floats to branch HEAD on any consumer
# `cargo update`, splitting the graph into TWO egaku revs (this crate's chain
# vs the consumer's family-pinned one) — the split-rev duplicate that broke
# every mado nix build with E0463 "can't find crate for irodzuki"
# (v0.1.49..v0.1.53, bisected 2026-07-02). A rev pin only froze one side of
# that split; a registry dep has no HEAD to float to and semver-unifies with
# every other consumer, so the duplicate cannot form.
egaku = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
